name: Build repository appendix PDFs

on:
  push:
    paths:
      - '.appendix_pdf_build/READY'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - name: Build appendices A-C
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/Publication_Appendices"
          work="$RUNNER_TEMP/appendix_pdf_build"
          mkdir -p "$work"
          cp "$GITHUB_WORKSPACE/results/2_fixed_weight_validation_nest10/figures/post_discovery_fixed_weight_validation_survival_heatmap_by_seed.png" "$work/fig_confirmatory_seed_survival.png" || true
          cat > "$work/preamble.tex" <<'EOF'
          \documentclass[11pt]{article}
          \usepackage[margin=1in]{geometry}
          \usepackage{graphicx}
          \usepackage{amsmath,amssymb,amsfonts}
          \usepackage{amsthm}
          \usepackage{booktabs}
          \usepackage{multirow}
          \usepackage{array}
          \usepackage{float}
          \usepackage{placeins}
          \usepackage{rotating}
          \usepackage{xcolor}
          \usepackage[hidelinks]{hyperref}
          \newcolumntype{P}[1]{>{\raggedright\arraybackslash}p{#1}}
          \setlength{\tabcolsep}{3pt}
          \DeclareMathOperator*{\argmin}{arg\,min}
          \DeclareMathOperator*{\argmax}{arg\,max}
          \newtheorem{proposition}{Proposition}
          \providecommand{\citep}[1]{\textcolor{gray}{[#1]}}
          \providecommand{\citet}[1]{\textcolor{gray}{#1}}
          \let\originalincludegraphics\includegraphics
          \renewcommand{\includegraphics}[2][]{\IfFileExists{#2}{\originalincludegraphics[#1]{#2}}{\fbox{\parbox{0.82\textwidth}{\centering Figure file: \texttt{#2}\par See archived publication results for the corresponding graphic.}}}}
          \raggedbottom
          \emergencystretch=2em
          EOF
          build_one () {
            name="$1"
            title="$2"
            shift 2
            cat "$work/preamble.tex" > "$work/$name.tex"
            {
              echo '\begin{document}'
              echo '\begin{center}'
              echo "{\LARGE\bfseries $title\par}"
              echo '\vspace{0.5em}'
              echo '{\large Supplement to Benchmark-Gated Composite Mean Estimation\par}'
              echo '\vspace{0.4em}'
              echo '{Alvaro Rivera-Eraso et al.\par}'
              echo '\end{center}'
              echo '\vspace{1em}'
            } >> "$work/$name.tex"
            for f in "$@"; do cat "$GITHUB_WORKSPACE/$f" >> "$work/$name.tex"; done
            echo '\end{document}' >> "$work/$name.tex"
            (cd "$work" && pdflatex -interaction=nonstopmode -file-line-error -halt-on-error "$name.tex")
            cp "$work/$name.pdf" "$out/$name.pdf"
          }
          build_one "Repository_Appendix_A_Locked_Unseen_Regimes" "Repository Appendix A: Construction of the locked-unseen related regimes" "Publication_Appendices/Repository_Appendix_A_Locked_Unseen_Regimes.tex"
          build_one "Repository_Appendix_B_Audits_and_Diagnostics" "Repository Appendix B: Detailed audit methods and secondary diagnostics" "Publication_Appendices/Repository_Appendix_B_Audits_and_Diagnostics.tex"
          build_one "Repository_Appendix_C_Theory_and_Methods" "Repository Appendix C: Extended theoretical and methodological details" "Publication_Appendices/Repository_Appendix_C1_Theory_and_Conditional_Properties.tex" "Publication_Appendices/Repository_Appendix_C2_Search_Simulation_and_Initial_Validation.tex" "Publication_Appendices/Repository_Appendix_C3_Expanded_and_External_Validation.tex"
          rm -f "$out/Repository_Appendix_A_Locked_Unseen_Regimes.tex" "$out/Repository_Appendix_B_Audits_and_Diagnostics.tex" "$out/Repository_Appendix_C1_Theory_and_Conditional_Properties.tex" "$out/Repository_Appendix_C2_Search_Simulation_and_Initial_Validation.tex" "$out/Repository_Appendix_C3_Expanded_and_External_Validation.tex"
          rm -rf "$GITHUB_WORKSPACE/.appendix_pdf_build"
          rm -f "$GITHUB_WORKSPACE/.github/workflows/build_appendix_pdfs.yml"
      - name: Commit PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Convert repository appendices A-C to PDF"
          git push
